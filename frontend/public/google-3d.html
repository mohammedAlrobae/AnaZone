<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnaZone 3D Photorealistic Earth</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
      user-select: none;
    }
    #map-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background: #000;
    }
  </style>
  <script>
    // Google Maps API Loader
    (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
        key: "AIzaSyA6myHzS10YXdcazAFalmXvDkrYCp5cLc8"
    });
  </script>
</head>
<body>
  <div id="map-container"></div>
  <script type="module">
    async function initMap() {
      try {
        const { Map3DElement } = await google.maps.importLibrary("maps3d");
        const container = document.getElementById("map-container");

        const map3d = new Map3DElement({
          center: { lat: 26.8, lng: 30.8, altitude: 0 },
          range: 17500000,
          tilt: 0,
          heading: 0,
          roll: 0,
          mode: "HYBRID"
        });

        map3d.style.width = "100%";
        map3d.style.height = "100%";
        container.appendChild(map3d);

        // Native 3D click listener
        map3d.addEventListener("gmp-click", (e) => {
          if (e && e.position) {
            const lat = typeof e.position.lat === "function" ? e.position.lat() : e.position.lat;
            const lng = typeof e.position.lng === "function" ? e.position.lng() : e.position.lng;
            const altitude = typeof e.position.altitude === "function" ? e.position.altitude() : (e.position.altitude || 0);

            try {
              window.parent.postMessage({
                type: "ANAZONE_MAP_3D_CLICK",
                lat: Number(lat),
                lng: Number(lng),
                altitude: Number(altitude)
              }, "*");
            } catch (postErr) {
              console.error("postMessage error:", postErr);
            }
          }
        });

        // Notify parent that 3D engine is live
        window.parent.postMessage({ type: "ANAZONE_MAP_3D_READY" }, "*");
      } catch (err) {
        console.error("Google 3D Map init error:", err);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initMap);
    } else {
      initMap();
    }
  </script>
</body>
</html>
